plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def stableDebugKeystore = System.getenv("ANDROID_KEYSTORE_PATH")

android {
    namespace 'com.tamim.millhisab'
    compileSdk 35

    signingConfigs {
        if (stableDebugKeystore) {
            stableDebug {
                storeFile file(stableDebugKeystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (stableDebugKeystore) {
                signingConfig signingConfigs.stableDebug
            }
        }
    }

    defaultConfig {
        applicationId 'com.tamim.millhisab'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
}

dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation platform('com.google.firebase:firebase-bom:34.4.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    implementation 'com.google.code.gson:gson:2.11.0'
}